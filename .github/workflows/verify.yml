name: verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so a vsms merge that outruns this repository turns up here as a red
    # build rather than as a confidently wrong agent three weeks later.
    - cron: "23 6 * * *"
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: docs↔skills parity
    runs-on: ubuntu-latest
    steps:
      - name: Check out vsms-skills
        uses: actions/checkout@v4
        with:
          path: vsms-skills

      - name: Check out vsms
        uses: actions/checkout@v4
        with:
          repository: vaam-apps/vsms
          path: vsms
          # The gate reads docs/ and tests that claimed paths exist. It never
          # builds vsms — but it DOES ask git whether a page existed at the
          # baseline commit, which a depth-1 clone cannot answer. Full history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: verify-coverage
        working-directory: vsms-skills
        run: node tools/verify-coverage.mjs "$GITHUB_WORKSPACE/vsms"

  format:
    name: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes prettier@3 --check "**/*.{md,json,yml}"
